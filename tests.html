<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MOBILITY ZERO — тести</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <style>
    body { margin: 0; padding: calc(env(safe-area-inset-top) + 20px) 18px 40px; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #05070b; color: #eef2f7; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: #a5b0bf; margin: 0 0 16px; }
    .sum { font-size: 17px; font-weight: 700; margin: 12px 0 14px; }
    .ok { color: #22d6a1; } .fail { color: #ff6170; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 9px 0; border-top: 1px solid rgba(165, 185, 215, .14); }
    li small { display: block; color: #ff9aa4; margin-top: 3px; }
    a { color: #6db3ff; }
  </style>
</head>
<body>
  <h1>Перевірка фінансового модуля</h1>
  <p>Тести запускаються прямо у вашому браузері на тих самих файлах, що й застосунок. <a href="./">Повернутися до MOBILITY ZERO</a></p>
  <div class="sum" id="sum">Запуск…</div>
  <ul id="list"></ul>
  <script type="module">
    import { runAll } from './tests.js';
    const res = runAll();
    const failed = res.filter((r) => !r.ok).length;
    const sum = document.getElementById('sum');
    sum.textContent = failed ? `Не пройдено: ${failed} з ${res.length}` : `Усі ${res.length} тестів пройдено`;
    sum.className = `sum ${failed ? 'fail' : 'ok'}`;
    const list = document.getElementById('list');
    for (const r of res) {
      const li = document.createElement('li');
      const b = document.createElement('span');
      b.className = r.ok ? 'ok' : 'fail';
      b.textContent = r.ok ? '✓ ' : '✗ ';
      li.append(b, document.createTextNode(r.name));
      if (!r.ok) { const s = document.createElement('small'); s.textContent = r.error; li.append(s); }
      list.append(li);
    }
    window.__TESTS = { total: res.length, failed };
  </script>
</body>
</html>
